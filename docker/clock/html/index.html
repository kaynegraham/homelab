<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Lab Clock</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg { width: 100%; height: 100%; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .sans { font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
</style>
</head>
<body>
<svg id="panel" viewBox="0 0 240 128" preserveAspectRatio="xMidYMid meet">
  <circle cx="56" cy="56" r="48" fill="rgba(30, 32, 40, 0.55)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.6" />
  <g id="ticks" stroke="rgba(255, 255, 255, 0.7)" stroke-linecap="round"></g>
  <text x="56" y="24" text-anchor="middle" class="sans" font-size="6" fill="rgba(255,255,255,0.45)" letter-spacing="0.5">LT</text>

  <g id="windMarker" opacity="0">
    <path d="M56 6 L52 0 L60 0 Z" fill="#4dabf7" />
  </g>

  <line id="hour" x1="56" y1="56" x2="56" y2="32" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line id="minute" x1="56" y1="56" x2="56" y2="19" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" />
  <line id="second" x1="56" y1="62" x2="56" y2="15" stroke="#fa5252" stroke-width="1" stroke-linecap="round" />
  <circle cx="56" cy="56" r="2.6" fill="#fa5252" />

  <text id="local" x="118" y="24" class="mono" font-size="17" font-weight="700" fill="#ffffff">--:--:--</text>
  <text id="zulu" x="118" y="36" class="mono" font-size="8" fill="#9aa4b2">----Z UTC</text>

  <text id="station" x="118" y="52" class="sans" font-size="6.5" font-weight="700" fill="#4dabf7" letter-spacing="0.6">----</text>
  <text id="wind" x="118" y="64" class="mono" font-size="7.5" fill="#e9ecef">WIND ---°/--KT</text>
  <text id="temp" x="118" y="75" class="mono" font-size="7.5" fill="#e9ecef">TEMP --  DP --</text>
  <text id="qnh" x="118" y="86" class="mono" font-size="7.5" fill="#e9ecef">QNH ----</text>
  <text id="sky" x="118" y="97" class="mono" font-size="7.5" fill="#e9ecef">SKY ---</text>

  <line x1="8" y1="110" x2="232" y2="110" stroke="rgba(255,255,255,0.15)" stroke-width="0.6" />
  <g id="metarLines"></g>
</svg>

<script>
  // Config via URL, for example:
  //   ?airports=YPJT,YPPH        stations to show (first one is the main display)
  //   ?airports=YPJT,YPPH&rotate=15   cycle the main display every 15 seconds
  //   ?demo=1                    sample data for layout testing
  const AIRPORTS = {
    YPJT: { name: 'JANDAKOT', lat: -32.0975, lon: 115.8811 },
    YPPH: { name: 'PERTH', lat: -31.9403, lon: 115.9669 },
    YPEA: { name: 'PEARCE', lat: -31.6678, lon: 116.0150 },
    YPMR: { name: 'MURRAY FIELD', lat: -32.5084, lon: 115.8420 },
    YPKG: { name: 'KALGOORLIE', lat: -30.7894, lon: 121.4617 },
    YPPD: { name: 'PORT HEDLAND', lat: -20.3778, lon: 118.6264 },
    YPKA: { name: 'KARRATHA', lat: -20.7122, lon: 116.7733 },
    YPBO: { name: 'BROOME', lat: -17.9447, lon: 122.2322 },
  };

  const params = new URLSearchParams(location.search);
  const DEMO = params.has('demo');
  const ROTATE_S = Math.max(0, parseInt(params.get('rotate') || '0', 10));
  const stations = (params.get('airports') || 'YPJT')
    .toUpperCase().split(',').map(s => s.trim()).filter(s => /^[A-Z]{4}$/.test(s)).slice(0, 4);
  if (stations.length === 0) stations.push('YPJT');

  const REFRESH_MS = 10 * 60 * 1000;
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const pad = (n, len = 2) => String(Math.round(n)).padStart(len, '0');

  const LINE_GAP = 11;
  const panelHeight = 128 + (stations.length - 1) * LINE_GAP;
  $('panel').setAttribute('viewBox', `0 0 240 ${panelHeight}`);

  const metarRows = {};
  stations.forEach((code, i) => {
    const y = 121 + i * LINE_GAP;
    const label = document.createElementNS(SVG_NS, 'text');
    label.setAttribute('x', '8');
    label.setAttribute('y', y);
    label.setAttribute('class', 'mono');
    label.setAttribute('font-size', '6');
    label.setAttribute('font-weight', '700');
    label.setAttribute('fill', '#4dabf7');
    label.textContent = 'WX';
    const text = document.createElementNS(SVG_NS, 'text');
    text.setAttribute('x', '36');
    text.setAttribute('y', y);
    text.setAttribute('class', 'mono');
    text.setAttribute('font-size', '6');
    text.setAttribute('fill', '#cfd4da');
    text.textContent = `${code} loading...`;
    $('metarLines').append(label, text);
    metarRows[code] = { label, text };
  });

  const ticks = $('ticks');
  for (let i = 0; i < 12; i++) {
    const major = i % 3 === 0;
    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', '56');
    line.setAttribute('y1', major ? '10' : '11');
    line.setAttribute('x2', '56');
    line.setAttribute('y2', major ? '16' : '14');
    line.setAttribute('stroke-width', major ? '1.8' : '1');
    line.setAttribute('transform', `rotate(${i * 30} 56 56)`);
    ticks.appendChild(line);
  }

  const perth = new Intl.DateTimeFormat('en-AU', {
    timeZone: 'Australia/Perth', hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false
  });

  function tick() {
    const now = new Date();
    const parts = perth.formatToParts(now);
    const get = (t) => parseInt(parts.find(p => p.type === t).value, 10);
    const h24 = get('hour') % 24;
    const m = get('minute');
    const s = get('second');
    const sf = s + now.getMilliseconds() / 1000;

    $('second').setAttribute('transform', `rotate(${sf * 6} 56 56)`);
    $('minute').setAttribute('transform', `rotate(${(m + sf / 60) * 6} 56 56)`);
    $('hour').setAttribute('transform', `rotate(${((h24 % 12) + m / 60) * 30} 56 56)`);

    $('local').textContent = `${pad(h24)}:${pad(m)}:${pad(s)}`;
    $('zulu').textContent = `${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}Z UTC`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function fitText(el, maxWidth) {
    el.removeAttribute('textLength');
    el.removeAttribute('lengthAdjust');
    if (el.getComputedTextLength() > maxWidth) {
      el.setAttribute('textLength', maxWidth);
      el.setAttribute('lengthAdjust', 'spacingAndGlyphs');
    }
  }

  function skyFromCover(pct) {
    const oktas = Math.round((pct / 100) * 8);
    if (oktas === 0) return 'CLR';
    if (oktas <= 2) return 'FEW';
    if (oktas <= 4) return 'SCT';
    if (oktas <= 7) return 'BKN';
    return 'OVC';
  }

  function modelMetar(code, m) {
    const now = new Date();
    const stamp = `${pad(now.getUTCDate())}${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}Z`;
    const dir = Math.round(m.wind_direction_10m / 10) * 10;
    const kt = m.wind_speed_10m;
    const gust = m.wind_gusts_10m - kt >= 10 ? `G${pad(m.wind_gusts_10m)}` : '';
    const wind = kt < 1 ? '00000KT' : `${pad(dir, 3)}${pad(kt)}${gust}KT`;
    const t = (v) => (v < 0 ? 'M' : '') + pad(Math.abs(v));
    return `${code} ${stamp} ${wind} ${skyFromCover(m.cloud_cover)} ${t(m.temperature_2m)}/${t(m.dew_point_2m)} Q${Math.round(m.pressure_msl)}`;
  }

  const state = { models: {}, metars: {}, shown: 0 };

  function renderMain() {
    const code = stations[state.shown];
    const info = AIRPORTS[code];
    $('station').textContent = info ? `${code} · ${info.name}` : code;
    const m = state.models[code];
    if (!m) {
      $('wind').textContent = 'WIND ---';
      $('temp').textContent = 'TEMP --  DP --';
      $('qnh').textContent = 'QNH ----';
      $('sky').textContent = 'SKY ---';
      $('windMarker').setAttribute('opacity', '0');
      return;
    }
    const dir = Math.round(m.wind_direction_10m / 10) * 10;
    const kt = m.wind_speed_10m;
    const gust = m.wind_gusts_10m - kt >= 10 ? ` G${pad(m.wind_gusts_10m)}` : '';
    $('windMarker').setAttribute('transform', `rotate(${dir} 56 56)`);
    $('windMarker').setAttribute('opacity', kt < 1 ? '0' : '1');
    $('wind').textContent = kt < 1 ? 'WIND CALM' : `WIND ${pad(dir, 3)}°/${pad(kt)}KT${gust}`;
    $('temp').textContent = `TEMP ${pad(m.temperature_2m)}°  DP ${pad(m.dew_point_2m)}°`;
    $('qnh').textContent = `QNH ${Math.round(m.pressure_msl)}`;
    $('sky').textContent = `SKY ${skyFromCover(m.cloud_cover)} (${Math.round(m.cloud_cover)}%)`;
  }

  function renderMetars() {
    stations.forEach((code) => {
      const row = metarRows[code];
      const metar = state.metars[code];
      const m = state.models[code];
      if (metar) {
        row.label.textContent = 'METAR';
        row.text.textContent = metar;
      } else if (m) {
        row.label.textContent = 'MODEL';
        row.text.textContent = modelMetar(code, m);
      } else {
        row.label.textContent = 'WX';
        row.text.textContent = `${code} unavailable`;
      }
      fitText(row.text, 232 - 36);
    });
  }

  async function loadModels() {
    const known = stations.filter(c => AIRPORTS[c]);
    if (known.length === 0) return {};
    const lat = known.map(c => AIRPORTS[c].lat).join(',');
    const lon = known.map(c => AIRPORTS[c].lon).join(',');
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      '&current=temperature_2m,dew_point_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,cloud_cover' +
      '&wind_speed_unit=kn&timezone=UTC';
    const res = await fetch(url);
    if (!res.ok) throw new Error('model fetch failed');
    const data = await res.json();
    const list = Array.isArray(data) ? data : [data];
    const out = {};
    known.forEach((code, i) => { if (list[i]) out[code] = list[i].current; });
    return out;
  }

  async function loadMetars() {
    const res = await fetch(`/metar?ids=${stations.join(',')}&format=raw`);
    if (!res.ok) throw new Error('metar fetch failed');
    const out = {};
    (await res.text()).trim().split('\n').forEach((line) => {
      const clean = line.replace(/^(METAR|SPECI)\s+/, '').trim();
      const code = clean.slice(0, 4);
      if (stations.includes(code) && !out[code]) out[code] = clean;
    });
    return out;
  }

  function demoData() {
    const base = { temperature_2m: 16.4, dew_point_2m: 8.2, wind_speed_10m: 12, wind_direction_10m: 240,
                   wind_gusts_10m: 23, pressure_msl: 1018.3, cloud_cover: 30 };
    const models = {};
    const metars = {};
    stations.forEach((code, i) => {
      models[code] = { ...base, wind_direction_10m: 240 - i * 30, temperature_2m: 16.4 + i };
      metars[code] = `${code} 261230Z AUTO ${pad(240 - i * 30, 3)}12G23KT 9999 // NCD ${16 + i}/08 Q1018`;
    });
    return { models, metars };
  }

  async function update() {
    if (DEMO) {
      const d = demoData();
      state.models = d.models;
      state.metars = d.metars;
    } else {
      const [models, metars] = await Promise.all([
        loadModels().catch(() => ({})),
        loadMetars().catch(() => ({})),
      ]);
      state.models = models;
      state.metars = metars;
    }
    renderMain();
    renderMetars();
  }

  if (ROTATE_S > 0 && stations.length > 1) {
    setInterval(() => {
      state.shown = (state.shown + 1) % stations.length;
      renderMain();
    }, ROTATE_S * 1000);
  }

  update();
  setInterval(update, REFRESH_MS);
</script>
</body>
</html>
